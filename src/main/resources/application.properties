spring.application.name=splitsmart-backend
server.port=8080

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/splitsmart
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
jwt.secret=your_super_secret_jwt_key_change_this_in_production_environment
jwt.expiration=86400000

# Logging
logging.level.root=INFO
logging.level.com.splitsmart=DEBUG
